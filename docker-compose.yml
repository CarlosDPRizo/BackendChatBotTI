services:
  app:
    build: .
    container_name: flask-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    networks:
      - rede01
    depends_on:
      - db
    env_file:
      - .env

  # db:
  #   image: mysql:8.0
  #   container_name: database
  #   restart: always
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=root
  #     - MYSQL_DATABASE=chatbot
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql

  db:
    image: mysql:latest
    container_name: database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: passwd
      MYSQL_DATABASE: chatbot
    ports:
      - 3306:3306
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - rede01


  ngrok:
    image: ngrok/ngrok
    container_name: tunel-ngrok
    restart: always
    environment:
      - NGROK_AUTHTOKEN=2nylhLKI5puO4moqfoj6XENA7Bd_4eamU4jHxPB9hRY7n7HM7
    command: http app:3000 --url=guided-whale-initially.ngrok-free.app  # ⚠️ Mudei para "app:3000"
    depends_on:
      - app
    ports:
      - "4040:4040"

volumes:
  mysql_data:

networks:
  rede01:
    driver: bridge